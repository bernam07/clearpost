<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var s = localStorage.getItem('color-scheme');
        if (s === 'light' || s === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = s;
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Track CTT, DPD, InPost, DHL, GLS, and UPS parcels in a Clear Glass PWA." />
    <meta name="theme-color" content="#e8eff7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#091018" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ClearPost" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Open Graph for crisp iOS Share Sheet & link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClearPost" />
    <meta property="og:title" content="ClearPost — Parcel Tracking" />
    <meta property="og:description" content="All your parcels, through clear glass." />
    <meta property="og:image" content="https://clearpost-pt.web.app/pwa-512x512.png?v=2" />

    <!-- iOS Home Screen & Favicons (cache-busted for Safari) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ClearPost</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
